# MySQL connection settings ? update these to match your local database
spring.datasource.url=jdbc:mysql://localhost:3306/classmanager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically create/update tables based on the entity classes
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the console (helpful while learning/debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect